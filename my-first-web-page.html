<!-- Declares this document as HTML5 -->
<!DOCTYPE html>

<!-- Starts the HTML document and sets the language to English -->
<html lang="en">

<!-- Starts the head section -->
<head>

    <!-- Sets the character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the page display correctly on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title shown in the browser tab -->
    <title>My First Web Page</title>

    <!-- Ends the head section -->
</head>

<!-- Starts the visible content of the webpage -->
<body>

<!-- Displays the main heading -->
<h1>My First Web Page</h1>

<!-- Displays my username -->
<p><strong>Username:</strong> septBarthelus</p>

<!-- Displays my course name -->
<p><strong>Course Name:</strong> Introduction to Website Development</p>

<!-- Displays my course number -->
<p><strong>Course Number:</strong> IS 117</p>

<!-- Displays my course section -->
<p><strong>Course Section:</strong> 001</p>

<!-- Starts the footer -->
<footer>

    <!-- Displays the copyright symbol, my name, and the due date -->
    <p>&copy; 2026 Sept Barthelus | Due Date: October 29, 2026</p>

    <!-- Ends the footer -->
</footer>

<!-- Ends the visible content -->
</body>

<!-- Ends the HTML document -->
</html>
